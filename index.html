<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>SUIRA</title>
<style>
:root{
  --bg:#F4F4F6; --surface:#FFFFFF; --ink:#111114; --ink2:#3A3A40; --mute:#8A8A93; --mute2:#B4B4BC;
  --hair:rgba(17,17,20,.08); --fill:#EEEEF1; --fill2:#F7F7F9;
  --brand:#FF5A47; --brand-2:#FF7A3D; --brand-soft:#FFF1EE; --brand-ink:#E0402E;
  --slate:#5E6B85; --slate-soft:#EEF1F6;
  --ok:#1FA971; --ok-soft:#E7F7EF; --ng:#E5484D; --ng-soft:#FDECEC;
  --l-en:#3B6FF5; --l-ja:#0FA37F; --l-es:#E8890C; --l-fr:#7C5CF0; --l-zh:#E5484D; --l-zht:#B4235A; --l-ko:#0E9BB5;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(17,17,20,.04),0 4px 16px rgba(17,17,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP","Helvetica Neue",sans-serif;color:var(--ink);background:#E7E7EC;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.xs{width:14px;height:14px;stroke-width:2}
svg.i.l{width:26px;height:26px}

.phone{width:390px;height:844px;background:var(--bg);border-radius:52px;position:relative;overflow:hidden;box-shadow:0 0 0 11px #0E0E10,0 0 0 13px #2A2A2E,0 40px 90px rgba(20,10,40,.28);display:flex;flex-direction:column}
@media (max-width:500px){body{background:var(--bg)}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.status{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;font-size:15px;font-weight:600;background:var(--surface);position:relative;z-index:5}
.status svg{height:12px}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0E10}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;opacity:.85;z-index:70;pointer-events:none}

.screen{flex:1;display:none;flex-direction:column;min-height:0;background:var(--bg)}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:20px}
.scroll::-webkit-scrollbar,.chat::-webkit-scrollbar{display:none}

/* headers */
.lt{flex:none;background:var(--surface);padding:6px 20px 12px;display:flex;align-items:center;gap:10px}
.lt h1{font-size:30px;font-weight:800;letter-spacing:-.025em;flex:1}
.wordmark{font-size:24px;font-weight:900;letter-spacing:.2em;background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.cbtn:active{opacity:.6}
.nav{flex:none;background:var(--surface);height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:.5px solid var(--hair);position:relative}
.nav .back{width:36px;height:36px;display:grid;place-items:center;color:var(--ink);margin-left:-4px}
.nav .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.nav .who b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ttl{flex:1;font-size:17px;font-weight:700;text-align:center;margin-right:36px}
.pill-tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--slate-soft);color:var(--slate)}

/* search */
.search{margin:2px 20px 10px;background:var(--fill);border-radius:12px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute);font-size:15px}

/* avatar */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:19px;flex:none;position:relative}
.av.m{width:36px;height:36px;font-size:14px}
.av.s{width:30px;height:30px;font-size:12px}
.av svg{stroke:#fff}
.av.ph{background-size:cover!important;background-position:center!important}
.av .flag{position:absolute;right:-3px;bottom:-3px;width:42%;height:42%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.28);font-size:26px;line-height:1}
.demo-link{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;height:40px;font-size:14px;font-weight:700;color:var(--brand)}
.vseg{padding:2px 16px 6px}.vhead{font-size:12.5px;font-weight:700;color:var(--mute);padding:14px 22px 6px}
.vlang{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft,#FFEDE9);padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.s-p{font-size:12px;color:var(--mute);margin-top:3px}.s-j{font-size:12.5px;color:var(--ink2);margin-top:6px}
.nflag{display:inline-block;width:17px;height:17px;border-radius:50%;overflow:hidden;vertical-align:-2px;margin-left:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:none}
.nflag svg{width:100%;height:100%;display:block}
.sname .nflag{width:13px;height:13px;margin-left:4px;vertical-align:-2px}
.av .flag svg{width:100%;height:100%;display:block}
.av .flag i{font-style:normal;display:block;transform:scale(1.25);line-height:1}
.av.m .flag{font-size:18px}.av.s .flag{font-size:14px;right:-4px;bottom:-4px;width:50%;height:50%;box-shadow:0 0 0 1.5px #fff}

/* chat list */
.list{background:var(--surface)}
.row{display:flex;align-items:center;gap:13px;padding:10px 20px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:active{background:var(--fill2)}
.row .mid{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-bottom:.5px solid var(--hair);padding:4px 0 12px;margin-bottom:-10px}
.row:last-child .mid{border-bottom:none}
.row .top{display:flex;align-items:baseline;gap:8px}
.row .name{font-size:16px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .name small{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
.row .time{font-size:12px;color:var(--mute);flex:none}
.row .bot{display:flex;align-items:center;gap:8px;margin-top:3px}
.row .last{font-size:12.5px;color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pin{color:var(--mute2);display:flex}
.badge{background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.row.pinned{background:#FCFCFD}
.sec{font-size:13px;color:var(--mute);font-weight:600;padding:18px 24px 8px;text-transform:none;letter-spacing:.02em}

/* tab bar */
.tabbar{flex:none;height:84px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--hair);display:flex;padding:8px 18px 28px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--mute2);position:relative}
.tabbar button svg{width:26px;height:26px;stroke-width:1.7}
.tabbar button.on{color:var(--brand)}
.tabbar .dot{position:absolute;top:-3px;left:calc(50% + 7px);background:var(--brand);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700;border:2px solid #fff}

/* segmented */
.segc{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.segc button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}

/* chat */
.langbar{flex:none;background:var(--surface);display:flex;align-items:center;gap:8px;padding:8px 12px 10px;border-bottom:.5px solid var(--hair)}
.langbar .segc{flex:1}
.ghost{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:var(--ink2)}
.ghost.on{background:var(--slate-soft);color:var(--slate)}
.langbar{border-bottom:none!important;padding-bottom:6px!important}
.quota{flex:none;background:var(--surface);display:flex;align-items:center;gap:10px;padding:2px 14px 10px;border-bottom:.5px solid var(--hair)}
.qtrack{flex:1;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.qtrack i{display:block;height:100%;border-radius:2px;background:var(--brand-2);transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s}
.qtext{font-size:11.5px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
.qtext.low{color:var(--ng)}
.qminus{position:absolute;right:16px;font-size:12px;font-weight:800;color:var(--ng);opacity:0;transition:.6s;pointer-events:none}
.qminus.go{opacity:1;transform:translateY(-10px)}
.refill{flex:none;display:none;align-items:center;gap:10px;background:var(--surface);padding:10px 12px 0;border-top:.5px solid var(--hair)}
.refill.show{display:flex}
.refill span{flex:1;font-size:13px;font-weight:700;color:var(--ng);display:flex;align-items:center;gap:6px}
.refill button{height:34px;padding:0 14px;border-radius:17px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.composer input:disabled{background:var(--fill);color:var(--mute)}
.adov{position:absolute;inset:0;background:#0E0E10;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.adov.show{display:flex}
.adov .tag{position:absolute;top:64px;left:16px;font-size:11px;font-weight:800;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:6px}
.adov .cnt{position:absolute;top:62px;right:16px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-weight:800;font-size:13px}
.stopped{flex:1;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--mute)}
.recov{height:34px;padding:0 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;flex:none}
.timer{margin:10px 16px;background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.timer .top{display:flex;align-items:center;justify-content:space-between}
.timer .k{font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px}
.timer .lsel{display:flex;gap:6px}
.timer .lsel button{height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:700;background:var(--fill);color:var(--ink2)}
.timer .lsel button.on{background:var(--ink);color:#fff}
.timer .clock{font-size:52px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 16px;color:var(--ink)}
.timer .clock.run{color:var(--brand)}
.timer .ctrl{display:flex;justify-content:center;gap:18px}
.timer .ctrl button{width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.timer .go{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(255,90,71,.3)}
.timer .go svg{width:26px;height:26px}
.timer .end{background:var(--fill);color:var(--ink)}
.timer .end:disabled{opacity:.35}
.tabbar .rec{position:absolute;top:-1px;left:calc(50% + 9px);width:9px;height:9px;border-radius:5px;background:var(--brand);border:2px solid #fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.share{display:flex;justify-content:space-between;margin:4px 16px 0;background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.share button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink2);width:64px}
.share .sc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);font-size:14px;font-weight:800;letter-spacing:.02em}
.share .sc.ig{font-size:13px}
.hb{position:relative}
.hb .nb{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.badge.mute{background:var(--mute2)}
.row .muted{color:var(--mute2);display:inline-flex;vertical-align:-2px;margin-left:4px}
.nt{display:flex;gap:12px;padding:14px 20px;align-items:flex-start;background:var(--surface);border-bottom:.5px solid var(--hair);cursor:pointer;position:relative}
.nt.un{background:#FFF8F6}
.nt .nic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none}
.nt .tx{flex:1;font-size:14.5px;line-height:1.45}
.nt .tm{font-size:12px;color:var(--mute);margin-top:3px}
.nt .ud{width:8px;height:8px;border-radius:4px;background:var(--brand);margin-top:6px;flex:none}
.nt .act{margin-top:10px;display:flex;gap:8px}
.nt .act button{height:30px;padding:0 14px;border-radius:15px;font-size:12.5px;font-weight:700;background:var(--brand);color:#fff}
.nt .act button.g{background:var(--fill);color:var(--ink)}
.stab{flex:none;background:var(--surface);padding:0 16px 12px}
.rep-total{text-align:center;padding:18px 0 4px}
.rep-total .v{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rep-total .v small{font-size:16px;color:var(--mute);font-weight:700;margin:0 4px 0 2px}
.rep-total .k{font-size:12.5px;color:var(--mute);font-weight:600}
.sbars{display:flex;gap:12px;align-items:flex-end;height:150px;margin:18px 4px 0}
.sbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mute);font-weight:600}
.sbars .c.today{color:var(--ink)}
.sbars .stk{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:var(--fill)}
.sbars .stk i{display:block;width:100%}
.sbars .stk.zero{height:4px!important}
.dbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:18px 0 4px;background:var(--fill)}
.bd{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--hair)}
.bd:last-child{border:none}
.bd .sw{width:12px;height:12px;border-radius:4px;flex:none}
.bd .n{flex:1;font-size:15px;font-weight:650}
.bd .t{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.bd .p{font-size:12.5px;color:var(--mute);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.recrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--hair)}
.recrow:last-child{border:none}
.recrow .tm{font-size:12.5px;color:var(--mute);width:40px;font-variant-numeric:tabular-nums}
.recrow .bar{width:4px;height:30px;border-radius:2px;flex:none}
.recrow .n{flex:1;font-size:15px;font-weight:650}
.recrow .n small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:1px}
.recrow .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.manual{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px;height:48px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14.5px;width:calc(100% - 32px)}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mchips button{height:38px;padding:0 16px;border-radius:19px;background:var(--fill);font-weight:700;font-size:14px}
.mchips button.on{background:var(--ink);color:#fff}
.mlabel{font-size:13px;color:var(--mute);font-weight:600;margin-top:16px}
.tut{position:absolute;inset:50px 0 0 0;background:#fff;z-index:62;display:none;flex-direction:column}
.tut.show{display:flex}
.tut .skip{position:absolute;top:10px;right:16px;font-size:14px;font-weight:600;color:var(--mute);padding:6px;z-index:2}
.tut .pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tut .pages::-webkit-scrollbar{display:none}
.tut .pg{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:56px 28px 0}
.tut .art{width:100%;height:330px;border-radius:28px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;position:relative;overflow:hidden}
.tut h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:34px;text-align:center}
.tut p{font-size:15px;color:var(--mute);margin-top:10px;text-align:center;line-height:1.6}
.tut .foot{padding:0 24px 44px}
.tut .dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.tut .dots i{width:7px;height:7px;border-radius:4px;background:#DDDDE2;transition:.25s}
.tut .dots i.on{width:22px;background:var(--ink)}
.mk-b{padding:10px 14px;border-radius:18px;font-size:15px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);max-width:86%;display:flex;align-items:center;gap:8px}
.mk-b.me{background:var(--brand);color:#fff;align-self:flex-end}
.mk-b.l{align-self:flex-start}
.mk-arrow{color:var(--mute2);transform:rotate(90deg);display:flex}
.mk-seg{width:100%;background:#fff;border-radius:12px;padding:3px;display:flex;gap:2px;box-shadow:var(--shadow)}
.mk-seg span{flex:1;text-align:center;height:30px;line-height:30px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.mk-seg span.on{background:var(--ink);color:#fff}
.mk-card{width:100%;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.me-head{background:var(--surface);padding:6px 20px 22px;display:flex;flex-direction:column;align-items:center}
.me-av{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:36px;font-weight:800;position:relative}
.me-av .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:3px solid #fff}
.me-av .cam svg{width:15px;height:15px}
.me-name{font-size:22px;font-weight:800;margin-top:12px;letter-spacing:-.01em}
.me-id{font-size:13.5px;color:var(--mute);margin-top:2px}
.me-langs{display:flex;gap:6px;margin-top:12px;align-items:center}
.me-langs .sep{width:1px;height:14px;background:var(--hair);margin:0 4px}
.me-edit{margin-top:16px;height:36px;padding:0 20px;border-radius:18px;background:var(--fill);font-weight:700;font-size:13.5px}
.me-stats{display:flex;background:var(--surface);border-top:.5px solid var(--hair);border-bottom:.5px solid var(--hair)}
.me-stats div{flex:1;text-align:center;padding:14px 0}
.me-stats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.me-stats small{font-size:11.5px;color:var(--mute);font-weight:600}
.me-stats div+div{border-left:.5px solid var(--hair)}
.plan{margin:14px 16px 0;border-radius:20px;padding:16px;background:var(--surface);box-shadow:var(--shadow)}
.plan .top{display:flex;align-items:center;gap:10px}
.plan .nm{font-size:15px;font-weight:750;flex:1}
.plan .up{height:32px;padding:0 14px;border-radius:16px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.plan .up svg{width:15px;height:15px}
.plan .k{font-size:12px;color:var(--mute);font-weight:600;margin-top:14px;display:flex;justify-content:space-between}
.plan .tr{height:4px;border-radius:2px;background:var(--fill);margin-top:8px;overflow:hidden}
.plan .tr i{display:block;height:100%;background:var(--brand-2);border-radius:2px}
.set{display:flex;align-items:center;gap:13px;padding:0 16px;height:52px;border-bottom:.5px solid var(--hair);cursor:pointer;font-size:15.5px;font-weight:550}
.set:last-child{border:none}
.set .ic2{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.set .ic2 svg{width:17px;height:17px;stroke-width:2}
.set .lab{flex:1}
.set .val{font-size:14px;color:var(--mute);font-weight:500}
.set.danger{color:var(--ng)}
.sw2{width:51px;height:31px;border-radius:16px;background:#E3E3E8;position:relative;transition:.2s;flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:.2s}
.sw2.on{background:#34C759}
.sw2.on::after{left:22px}
.ver{text-align:center;font-size:11.5px;color:var(--mute2);padding:18px 0 8px}
.form{margin:14px 16px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:.5px solid var(--hair)}
.frow:last-child{border:none}
.frow label{width:96px;font-size:14.5px;font-weight:600;color:var(--ink2);flex:none}
.frow input,.frow textarea{flex:1;border:none;outline:none;font-size:15.5px;background:none;padding:14px 0;resize:none;font-family:inherit;min-width:0}
.frow .ro{flex:1;font-size:15.5px;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);padding:8px 20px 0;line-height:1.6}
.pad{padding:0 16px}
.faq{border-bottom:.5px solid var(--hair)}
.faq:last-child{border:none}
.faq summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;font-size:15px;font-weight:650;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary .chev{margin-left:auto;transition:.2s}
.faq[open] summary .chev{transform:rotate(90deg)}
.faq p{padding:0 16px 15px;font-size:14px;color:var(--ink2);line-height:1.7}
.legal{padding:4px 20px 20px;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.legal h4{font-size:14.5px;color:var(--ink);margin:16px 0 4px}
.prem-hero{margin:14px 16px 0;border-radius:24px;padding:24px 20px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.prem-hero::after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,71,.6),transparent 70%)}
.prem-hero .pz{font-size:13px;font-weight:700;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:6px}
.prem-hero .pr{font-size:34px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.prem-hero .pr small{font-size:15px;color:rgba(255,255,255,.6);font-weight:600}
.cmp{margin:14px 16px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.cmp .h,.cmp .r{display:grid;grid-template-columns:1fr 84px 92px;align-items:center;padding:0 16px;min-height:48px;border-bottom:.5px solid var(--hair);font-size:14px}
.cmp .h{font-size:12px;color:var(--mute);font-weight:700;min-height:38px}
.cmp .r:last-child{border:none}
.cmp .r span:nth-child(2),.cmp .r span:nth-child(3),.cmp .h span:nth-child(2),.cmp .h span:nth-child(3){text-align:center}
.cmp .r span:nth-child(3){font-weight:700;color:var(--brand)}
.blk{display:flex;align-items:center;gap:12px;padding:12px 16px}
.blk .n{flex:1;font-size:15px;font-weight:650}
.blk button{height:32px;padding:0 14px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:700}
.bubble.pending{opacity:.55}
/* --- iPhoneアプリとして動くとき（Capacitor） --- */
html.native body{background:var(--bg);-webkit-user-select:none;user-select:none}
html.native input,html.native textarea{-webkit-user-select:text;user-select:text}
html.native .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
html.native .status,html.native .home-ind{display:none}
html.native .lt{padding-top:calc(env(safe-area-inset-top) + 8px)}
html.native .nav{height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
html.native .tabbar{height:auto;padding-bottom:max(env(safe-area-inset-bottom),10px)}
html.native .composer{padding-bottom:max(env(safe-area-inset-bottom),10px)}
html.native .ob,html.native .tut{inset:0;padding-top:calc(env(safe-area-inset-top) + 16px)}
html.native .ob{padding-bottom:max(env(safe-area-inset-bottom),20px)}
html.native .tut .foot{padding-bottom:max(env(safe-area-inset-bottom),20px)}
html.native .qtop{padding-top:calc(env(safe-area-inset-top) + 8px)}
html.native .qfoot{padding-bottom:max(env(safe-area-inset-bottom),20px)}
html.native .sheet .body{padding-bottom:max(env(safe-area-inset-bottom),24px)}
html.native .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--brand);animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{position:absolute;inset:0;background:#fff;z-index:95;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.boot.hide{display:none}
/* --- 起動画面（スプラッシュ） --- */
.splash{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#FF5A47 0%,#FF6B42 55%,#FF8A3D 100%);color:#fff;transition:opacity .5s ease,transform .5s ease;overflow:hidden}
.splash::before,.splash::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.splash::before{width:420px;height:420px;right:-160px;top:-140px;animation:spFloat 6s ease-in-out infinite}
.splash::after{width:300px;height:300px;left:-130px;bottom:-90px;animation:spFloat 7s ease-in-out infinite reverse}
@keyframes spFloat{50%{transform:translate(10px,14px)}}
.splash .sp-logo{width:92px;height:92px;border-radius:28px;background:#fff;display:grid;place-items:center;color:var(--brand);
  box-shadow:0 18px 40px rgba(150,30,10,.25);opacity:0;transform:scale(.6);animation:spPop .6s cubic-bezier(.2,1.4,.4,1) .1s forwards}
.splash .sp-logo svg{width:50px;height:50px;stroke-width:2}
.splash .sp-title{display:flex;margin-top:26px;font-size:62px;font-weight:900;letter-spacing:.16em;padding-left:.16em;line-height:1}
.splash .sp-title span{opacity:0;transform:translateY(18px);animation:spUp .55s cubic-bezier(.2,.9,.3,1) forwards}
.splash .sp-tag{margin-top:16px;font-size:13px;font-weight:700;letter-spacing:.32em;opacity:0;animation:spFade .6s ease 1s forwards}
@keyframes spPop{to{opacity:1;transform:none}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:.85}}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash.hide{display:none}
.agree{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink2);line-height:1.6;margin-top:16px;cursor:pointer}
.agree .pick{margin-top:1px}
.agree a{color:var(--brand);font-weight:700;text-decoration:none}
.sname{font-size:11px;color:var(--mute);margin:8px 0 -1px 38px;font-weight:600}
.bubble.hidden{background:var(--fill)!important;color:var(--mute)!important;font-size:13px;font-style:italic}
.subinfo{font-size:11.5px;color:var(--mute);line-height:1.7;padding:12px 20px 0;text-align:center}
.subinfo a{color:var(--ink2);font-weight:600}
.peek{flex:none;background:var(--slate-soft);color:var(--slate);font-size:12px;font-weight:700;text-align:center;padding:6px;display:none;align-items:center;justify-content:center;gap:6px}
.peek.show{display:flex}
.chat{flex:1;overflow-y:auto;padding:8px 14px 14px;background:var(--bg);min-height:0}
.daysep{text-align:center;margin:14px 0 8px;font-size:11.5px;color:var(--mute);font-weight:600}
.msg{display:flex;gap:8px;margin:3px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.msg+.msg.me,.msg.me+.msg:not(.me){margin-top:10px}
.bubble{max-width:74%;padding:9px 14px;border-radius:20px;font-size:15.5px;line-height:1.45;cursor:pointer;word-break:break-word;transition:transform .12s}
.bubble:active{transform:scale(.97)}
.them .bubble{background:var(--surface);border-bottom-left-radius:6px;box-shadow:0 .5px 1px rgba(0,0,0,.06)}
.me .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg .meta{font-size:10.5px;color:var(--mute);white-space:nowrap;margin-bottom:2px;text-align:right;line-height:1.3}
.saved{text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--brand)}
.me .saved{text-decoration-color:rgba(255,255,255,.8)}
.composer{flex:none;background:var(--surface);padding:8px 12px 30px;border-top:.5px solid var(--hair);display:flex;gap:8px;align-items:center}
.composer input{flex:1;border:.5px solid var(--hair);background:var(--fill2);border-radius:20px;height:40px;padding:0 16px;font-size:16px;outline:none}
.composer input:focus{border-color:#D8D8DE;background:#fff}
.sendb{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;transition:.15s}
.sendb.off{background:var(--fill);color:var(--mute2)}
.sendb svg{stroke-width:2.4}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(10,10,14,.32);opacity:0;pointer-events:none;transition:.22s;z-index:20}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1);max-height:84%;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#D9D9DE;margin:8px auto 0}
.sheet .x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2)}
.sheet .body{overflow-y:auto;padding:16px 20px 40px}
.sent{margin-top:14px;background:var(--fill2);border:.5px solid var(--hair);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.sent .t{flex:1;font-size:19px;font-weight:650;line-height:1.45;letter-spacing:-.005em}
.sent .py{font-size:13px;color:var(--mute);margin-top:4px;font-weight:400}
.iconb{width:34px;height:34px;border-radius:50%;background:#fff;border:.5px solid var(--hair);display:grid;place-items:center;color:var(--ink);flex:none;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.orig-dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--brand);margin-left:5px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:8px 13px;border-radius:12px;background:#fff;border:1px solid #E4E4E9;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;position:relative}
.chip .py{font-size:10.5px;color:var(--mute);font-weight:500}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.chip.sv::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:6px;background:var(--ok);border:2px solid #fff}
.detail{margin-top:14px;border-radius:var(--r-md);padding:16px;background:#fff;border:.5px solid var(--hair);box-shadow:var(--shadow)}
.detail .w{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.detail .r{font-size:13px;color:var(--mute);margin-top:2px}
.detail .mean{font-size:16px;margin-top:8px;color:var(--ink2)}
.btn{width:100%;height:50px;border-radius:14px;font-weight:700;font-size:16px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{background:#fff;color:var(--ink);border:1px solid #DEDEE3}
.btn.done{background:var(--ok-soft);color:var(--ok)}
.btn:disabled{opacity:.35}
.mi{display:flex;align-items:center;gap:14px;width:100%;height:56px;font-size:16px;font-weight:600;border-bottom:.5px solid var(--hair);text-align:left}
.mi:last-child{border:none}
.mi .ic{width:36px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink)}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:8px}

/* lang badge */
.lb{display:inline-grid;place-items:center;min-width:26px;height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff}
.lb-zht{background:var(--l-zht)}.lb-ko{background:var(--l-ko)}.lb-en{background:var(--l-en)}.lb-ja{background:var(--l-ja)}.lb-es{background:var(--l-es)}.lb-fr{background:var(--l-fr)}.lb-zh{background:var(--l-zh)}
.lb.big{min-width:40px;height:40px;border-radius:12px;font-size:13px}

/* cards & lists */
.group{background:var(--surface);margin:0 16px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.group .row{padding:12px 16px}
.group .row .mid{padding:6px 0 14px;margin-bottom:-12px}
.chev{color:var(--mute2);display:flex}
.count{font-size:14px;color:var(--mute);font-weight:500}
.card{background:var(--surface);margin:10px 16px;border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);position:relative}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.s-o{font-size:17px;font-weight:650;line-height:1.5;padding-right:44px}
.s-d{font-size:12px;color:var(--mute);margin-top:8px}
.card .iconb{position:absolute;right:14px;top:14px}
.w-row{display:flex;gap:12px;align-items:flex-start}
.w-w{font-size:19px;font-weight:750;letter-spacing:-.005em}
.w-m{font-size:14px;color:var(--ink2);margin-top:2px}
.lvl{display:flex;gap:3px;margin-top:2px}
.lvl i{width:12px;height:4px;border-radius:2px;background:var(--fill)}
.lvl i.f{background:var(--ok)}
.vbtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:700}
.vbtn.native{background:var(--ink);color:#fff}
.vbtn.req{background:var(--fill);color:var(--ink)}
.vbtn.wait{background:var(--fill);color:var(--mute)}
.wave{display:inline-flex;gap:2px;align-items:center;height:14px}
.wave i{width:2.5px;border-radius:2px;background:currentColor;display:block}
.seg-wrap{padding:12px 16px 4px}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:48px 20px}

/* learning */
.hero{margin:6px 16px 4px;border-radius:24px;padding:20px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;cursor:pointer;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,71,.55),transparent 70%)}
.hero .hi{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hero b{font-size:19px;font-weight:750;display:block}
.hero small{font-size:12.5px;color:rgba(255,255,255,.6)}
.hero .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;position:relative;z-index:1}
.hero .go svg{fill:#fff;stroke:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 16px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:14px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:5px}
.stat .v{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.rings{display:flex;gap:10px;margin:10px 16px}
.ringc{flex:1;background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.ringc .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.ringc .v small{font-size:12px;color:var(--mute);font-weight:600}
.ringc .k{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
.ch-h{display:flex;justify-content:space-between;align-items:baseline}
.ch-h .k{font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px}
.ch-h .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bars{display:flex;gap:10px;align-items:flex-end;height:84px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--mute);font-weight:600;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px;display:block}
.st-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--hair)}
.st-row:last-child{border:none}
.st-row .w{font-size:16px;font-weight:700}
.st-row .d{font-size:12.5px;color:var(--mute);margin-top:1px}
.st-row .n{margin-left:auto;font-size:13px;font-weight:800;padding:4px 9px;border-radius:8px}

/* forms */
.field{display:flex;align-items:center;gap:8px;margin:14px 16px 6px;background:var(--surface);border-radius:12px;height:46px;padding:0 14px;box-shadow:var(--shadow);color:var(--mute)}
.field input{flex:1;border:none;outline:none;font-size:16px;background:none;color:var(--ink)}
.actions{display:flex;gap:10px;margin:10px 16px 0}
.actions button{flex:1;height:46px;background:var(--surface);border-radius:12px;font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.addb{height:32px;padding:0 16px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;flex:none}
.addb.done{background:var(--fill);color:var(--mute);display:grid;place-items:center;padding:0;width:32px}
.pick{width:24px;height:24px;border-radius:50%;border:1.5px solid #CFCFD6;display:grid;place-items:center;color:#fff;flex:none}
.pick.on{background:var(--brand);border-color:var(--brand)}

/* onboarding */
.ob{position:absolute;inset:50px 0 0 0;background:#fff;z-index:60;display:flex;flex-direction:column;padding:16px 24px 44px}
.ob.hide{display:none}
.ob .mark{margin:auto 0 0;text-align:center}
.ob .logo{width:84px;height:84px;border-radius:26px;margin:0 auto 18px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:0 14px 30px rgba(255,90,71,.35)}
.ob .logo svg{width:44px;height:44px;stroke:#fff;stroke-width:2}
.ob .wm{font-size:34px;font-weight:900;letter-spacing:.28em;padding-left:.28em}
.ob .tg{font-size:13px;color:var(--mute);margin-top:8px;letter-spacing:.18em;font-weight:600}
.ob .stack{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.ob .btn{margin:0}
.ob .terms{font-size:11px;color:var(--mute);text-align:center;margin-top:6px}
.ob .prog{display:flex;gap:6px}
.ob .prog i{flex:1;height:4px;border-radius:2px;background:var(--fill)}
.ob .prog i.on{background:var(--ink)}
.ob h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:22px;display:flex;align-items:baseline;gap:10px}
.ob h2 small{font-size:15px;color:var(--mute);font-weight:600}
.slots{display:flex;gap:8px;margin:18px 0 4px}
.slot{flex:1;height:40px;border-radius:12px;border:1.5px dashed #D6D6DD;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--mute)}
.slot.f{border:1.5px solid var(--ink);color:var(--ink)}
.slot.me{background:var(--ink);border-color:var(--ink);color:#fff}
.lopts{display:flex;flex-direction:column;gap:8px;margin-top:14px;overflow-y:auto;min-height:0;flex:1;padding-bottom:12px}
.lopt{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;border-radius:16px;border:1.5px solid #E6E6EB;font-size:17px;font-weight:650;text-align:left;transition:.12s}
.lopt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #CFCFD6;display:grid;place-items:center;color:#fff}
.lopt.on{border-color:var(--ink);background:#FAFAFB}
.lopt.on .ck{background:var(--ink);border-color:var(--ink)}
.lopt:disabled{opacity:.35}
.ob .next{margin-top:10px;flex:none}
.ob .obtop{display:flex;align-items:center;gap:10px;height:40px;margin:-4px -8px 6px}
.ob .obback{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.ob .obtop .prog{flex:1;margin-right:8px}
.ob .fld{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.ob .fld label{font-size:13px;font-weight:600;color:var(--mute)}
.ob .fld input{height:50px;border-radius:14px;border:1.5px solid #E4E4E9;padding:0 16px;font-size:16px;outline:none;background:#fff}
.ob .fld input:focus{border-color:var(--ink)}
.ob .or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12.5px;font-weight:600;margin:18px 0}
.ob .or::before,.ob .or::after{content:"";flex:1;height:1px;background:var(--hair)}
.ob .link{font-size:13.5px;color:var(--ink2);font-weight:600;text-align:center;margin-top:14px}
.ob .link b{color:var(--brand)}
.ob .sub2{font-size:14.5px;color:var(--mute);margin-top:8px}

/* quiz */
.quiz{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.quiz.show{display:flex}
.qtop{display:flex;align-items:center;gap:12px;padding:58px 16px 8px}
.qbar{flex:1;height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.qbar div{height:100%;background:var(--ink);transition:width .3s;border-radius:3px}
.qn{font-size:13px;font-weight:700;color:var(--mute);min-width:30px;text-align:right}
.qcard{margin:18px 16px 14px;background:var(--surface);border-radius:24px;padding:28px 20px 20px;text-align:center;box-shadow:var(--shadow)}
.qcard .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:600}
.qcard .qw{font-size:38px;font-weight:850;margin:14px 0 2px;letter-spacing:-.02em}
.qcard .qr{color:var(--mute);font-size:14px}
.qcard .ctx{font-size:14px;color:var(--ink2);background:var(--fill2);border-radius:12px;padding:12px 14px;line-height:1.55;margin-top:16px;text-align:left}
.qcard mark{background:#FFE2DD;border-radius:4px;padding:0 3px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.opt{background:var(--surface);border-radius:16px;min-height:56px;padding:0 18px;font-size:16px;font-weight:600;text-align:left;border:1.5px solid transparent;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:#11744F}
.opt.ng{border-color:var(--ng);background:var(--ng-soft);color:#B4282D}
.qfoot{margin-top:auto;padding:16px 16px 40px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:2px}
.result{text-align:center;padding:120px 24px 0}
.result .big{width:96px;height:96px;border-radius:30px;margin:0 auto;background:var(--ink);display:grid;place-items:center;color:#fff}
.result .big svg{width:48px;height:48px;stroke-width:1.8}
.result h2{font-size:30px;margin-top:22px;letter-spacing:-.02em}

.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,14px);background:rgba(17,17,20,.92);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;transition:.22s;z-index:80;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px)}

/* ===== AI翻訳APIの設定 =====
   API_URL に Cloudflare Workers のURLを貼ると、本物のAI翻訳になります。
   空のままなら、これまで通りサンプルの翻訳で動きます。 */
const API_URL="";
const rawV=t=>{const o={};Object.keys(LN).forEach(l=>o[l]={t,k:[]});return o;};
async function translateAPI(t){
  const targets=roomLangsFor(room).filter(l=>l!==myLang);
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,from:myLang,targets,meaningLang:myLang})});
  const j=await res.json();if(!res.ok||j.error)throw new Error(j.error||res.status);
  Object.keys(j.d||{}).forEach(l=>{D[l]=Object.assign(D[l]||{},j.d[l]);});      /* 分解した語句の意味を辞書に追加 */
  const v=rawV(t);Object.keys(j.v||{}).forEach(l=>{if(LN[l])v[l]={t:j.v[l].t||t,k:(j.v[l].k||[]).filter(k=>(j.v[l].t||"").includes(k)),p:j.v[l].p};});
  return v;}
async function send(){const inp=document.getElementById("inp"),t=inp.value.trim();if(!t)return;
  inp.value="";setTimeout(()=>{inp.value="";sendState();},0);
  const c=costOf(t);
  if(c>quota){quota=0;renderQuota();pushMine(rawV(t));fakeReply();return;}   /* 文字数切れ：翻訳せずそのまま送る */
  quota-=c;renderQuota(c);
  if(API_URL){                                   /* 本物のAI翻訳 */
    const m=pushMine(rawV(t),true);
    try{m.v=await translateAPI(t);}catch(e){toast(Is("alert","s")+"翻訳できませんでした");quota+=c;renderQuota();}
    m.pending=false;renderChat();fakeReply();return;}
  const q=QUICK.find(x=>x[myLang].t===t);pushMine(q?JSON.parse(JSON.stringify(q)):rawV(t));fakeReply();}
function onKey(e){if(e.key!=="Enter"||e.isComposing||e.keyCode===229)return;e.preventDefault();send();}

function startQuiz(){const pool=vocab.filter(v=>v.lang!==myLang&&D[v.lang]&&D[v.lang][v.w]).slice(0,5);
  qs=pool.map(v=>{const right=D[v.lang][v.w].mean,wrong=[...new Set(Object.values(D[v.lang]).map(d=>d.mean))].filter(x=>x!==right);return {v,right,opts:shuffle([right,...shuffle(wrong).slice(0,3)])};});
  qi=0;score=0;document.getElementById("quiz").classList.add("show");renderQ();}
function renderQ(){const z=document.getElementById("quiz");
  if(qi>=qs.length){z.innerHTML=`<div class="result"><div class="big">${Is("check")}</div><h2>${score} / ${qs.length}</h2></div><div class="qfoot"><button class="btn dark" onclick="closeQuiz()">完了</button></div>`;return;}
  const q=qs[qi],d=D[q.v.lang][q.v.w];
  z.innerHTML=`<div class="qtop"><button class="cbtn" onclick="closeQuiz()">${Is("x","s")}</button><div class="qbar"><div style="width:${qi/qs.length*100}%"></div></div><span class="qn">${qi+1}/${qs.length}</span></div>

      <button class="iconb" style="margin:12px auto 0" onclick="say(qs[qi].v.w,qs[qi].v.lang)">${Is("vol","s")}</button>
      <div class="ctx">${q.v.src.replace(q.v.w,`<mark>${q.v.w}</mark>`)}</div></div>

function answer(k,el){const q=qs[qi];if(q.done)return;q.done=true;
  document.querySelectorAll(".opt").forEach((o,i)=>{if(q.opts[i]===q.right){o.classList.add("ok");o.insertAdjacentHTML("beforeend",Is("check","s"));}});
  const ok=q.opts[k]===q.right;if(!ok){el.classList.add("ng");el.insertAdjacentHTML("beforeend",Is("x","s"));}else{score++;q.v.lv=Math.min(5,q.v.lv+1);}
  document.getElementById("qfoot").innerHTML=`<button class="btn ${ok?'pri':'dark'}" onclick="qi++;renderQ()">次へ</button>`;}
